name: Real widgets only

# A quicker loop for the tests that drive iOS's own Home Screen and Lock Screen editing
# (UITests/RealWidgetUITests.swift). Runs on pushes to the real-widget branch, or by hand.
on:
  push:
    branches: [real-widget]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real:
    name: Real widgets on the simulator
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and generate the project
        run: |
          mkdir -p logs/real
          brew install xcodegen 2>&1 | tail -1
          xcodegen generate 2>&1 | tail -2

      - name: Pick and start a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          best = None
          for rt, devs in d.items():
              if "iOS" not in rt: continue
              ver = tuple(int(x) for x in rt.split("iOS-")[-1].split("-"))
              for dev in devs:
                  if dev["name"] in ("iPhone 17 Pro", "iPhone 17"):
                      if best is None or ver > best[0]: best = (ver, dev["udid"], dev["name"])
          print(best[1])
          ')
          echo "SIM=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Curtain.xcodeproj -scheme Curtain \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build/sim \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 \
            2>&1 | tee logs/sim-build-full.log | grep -E "error:|\*\* " | tee logs/sim-build.log

      - name: Run the real-widget tests
        continue-on-error: true
        run: |
          xcrun simctl bootstatus "$SIM" -b | tail -1
          TEST_RUNNER_CURTAIN_REAL_WIDGET=1 xcodebuild test-without-building -project Curtain.xcodeproj -scheme Curtain \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath build/sim \
            -only-testing:CurtainUITests/RealWidgetUITests \
            2>&1 | tee logs/real/test-full.log | grep -E "NOTE|error:|Test Case|Executed" | tee logs/real/test.log

      - name: Save logs to the ci-logs-real branch
        if: always()
        run: |
          cd logs
          gzip -f sim-build-full.log real/test-full.log || true
          echo "commit ${{ github.sha }} run ${{ github.run_id }} attempt ${{ github.run_attempt }} status ${{ job.status }}" > STATUS
          git init -q -b logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "real-widget logs for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" logs:ci-logs-real
